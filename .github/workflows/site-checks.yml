name: Contrôle du site déployé
on:
  status:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-site-checks
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.state == 'success' && startsWith(github.event.context, 'Vercel'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Vérifier que le déploiement concerne main
        id: target
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.repos.getBranch({...context.repo, branch:'main'});
            const sha = context.payload.sha || context.sha;
            core.setOutput('current', data.commit.sha === sha);
            core.setOutput('sha', sha);
      - uses: actions/checkout@v4
        if: steps.target.outputs.current == 'true'
        with:
          ref: ${{ steps.target.outputs.sha }}
      - uses: actions/setup-node@v4
        if: steps.target.outputs.current == 'true'
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        if: steps.target.outputs.current == 'true'
      - run: npx playwright install --with-deps chromium
        if: steps.target.outputs.current == 'true'
      - name: Attendre la bonne version en production
        if: steps.target.outputs.current == 'true'
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: node scripts/wait-for-production.mjs
      - name: Contrôler ordinateur et mobile
        if: steps.target.outputs.current == 'true'
        env:
          SITE_URL: https://election-2027-candidats.vercel.app
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-controle-site
          path: |
            playwright-report/
            test-results/
          retention-days: 7
